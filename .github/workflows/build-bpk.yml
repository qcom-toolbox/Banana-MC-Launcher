# Builds mclauncher.bpk (i686 + x86_64) with Banana OS's SDK, like
# `make BANANA_OS=Banana-OS` on a Linux machine (README: Build).
#
# - push / pull request: the .bpk is uploaded as a build artifact
# - push to main: also a prerelease, tagged build-<run number>, carries the .bpk
# - pushing a v* tag: a full release with the .bpk (like Banana OS's releases)

name: Build .bpk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md', '.gitignore', '.gitattributes' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write                # (the release step on v* tags)

jobs:
  bpk:
    name: mclauncher.bpk (i686 + x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the launcher
        uses: actions/checkout@v4

      - name: Check out Banana OS
        uses: actions/checkout@v4
        with:
          repository: qcom-toolbox/Banana-OS
          path: Banana-OS

      - name: Install the build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc gcc-multilib binutils make python3

      - name: Build
        run: make BANANA_OS="$GITHUB_WORKSPACE/Banana-OS"

      - name: Check the package
        run: |
          test -s mclauncher.bpk
          echo "mclauncher.bpk: $(du -h mclauncher.bpk | cut -f1)"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: mclauncher.bpk
          path: mclauncher.bpk
          if-no-files-found: error

      - name: Prerelease (every push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          notes="**mclauncher.bpk** - the Minecraft launcher (i686 + x86_64), built from $(git rev-parse --short "$GITHUB_SHA").

          Install on Banana OS: \`pkg install mclauncher.bpk\` (needs java.bpk from a Banana OS release)."
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
            --title "Minecraft Launcher build $GITHUB_RUN_NUMBER" --notes "$notes" mclauncher.bpk \
            || gh release upload "$tag" mclauncher.bpk --clobber

      - name: Release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --title "Minecraft Launcher $tag" --generate-notes mclauncher.bpk \
            || gh release upload "$tag" mclauncher.bpk --clobber
